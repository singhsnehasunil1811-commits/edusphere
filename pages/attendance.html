<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management - EduPortal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css?v=5">
  <link rel="stylesheet" href="../css/forms.css?v=5">
  <link rel="stylesheet" href="../css/tables.css?v=5">
  <link rel="stylesheet" href="../css/chatbot.css?v=3">
  <link rel="stylesheet" href="../css/responsive.css?v=3">
</head>

<body data-page-id="attendance" data-page-title="Attendance Tracker">

  <div class="app-container">
    <aside class="sidebar" id="sidebarContainer"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbarContainer"></header>

      <main class="page-content">
        <div class="table-toolbar">
          <div>
            <h2 style="font-size:18px; font-weight:700; color:var(--text-primary);">Student Attendance Register</h2>
            <p style="font-size:13px; color:var(--text-muted);">Track daily classroom attendance and monitor mandatory
              75% eligibility criteria.</p>
          </div>
          <button class="btn btn-primary" id="markAttendanceBtn" onclick="openModal('markAttendanceModal')">
            <i class="fas fa-calendar-check"></i> Mark Attendance
          </button>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Date</th>
                <th>Attended / Total</th>
                <th>Attendance %</th>
                <th>Daily Status</th>
                <th>Eligibility</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody">
              <tr>
                <td colspan="8" class="empty-state">
                  <div class="spinner"></div> Loading attendance...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Mark Attendance Modal -->
  <div class="modal-backdrop" id="markAttendanceModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Record Class Attendance</h3>
        <button class="modal-close" onclick="closeModal('markAttendanceModal')"><i class="fas fa-times"></i></button>
      </div>
      <form id="markAttendanceForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Select Student <span class="required">*</span></label>
            <select class="form-control" id="attStudentSelect" required></select>
          </div>

          <div class="form-group">
            <label class="form-label">Subject Title <span class="required">*</span></label>
            <input type="text" class="form-control" id="attSubject" required value="Full Stack Java Development">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Total Conducted Lectures</label>
              <input type="number" class="form-control" id="attTotalClasses" value="40" min="1">
            </div>
            <div class="form-group">
              <label class="form-label">Lectures Attended</label>
              <input type="number" class="form-control" id="attPresentClasses" value="36" min="0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="attDate">
            </div>
            <div class="form-group">
              <label class="form-label">Status <span class="required">*</span></label>
              <select class="form-control" id="attStatus" required>
                <option value="Present" selected>Present</option>
                <option value="Absent">Absent</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('markAttendanceModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Attendance Log</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="../js/api.js?v=5"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/utils.js?v=5"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/app.js?v=5"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/attendance.js"></script>
</body>

</html>
