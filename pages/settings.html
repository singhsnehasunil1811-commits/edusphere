<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Settings - EduPortal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css?v=5">
  <link rel="stylesheet" href="../css/forms.css?v=5">
  <link rel="stylesheet" href="../css/tables.css?v=5">
  <link rel="stylesheet" href="../css/chatbot.css?v=3">
  <link rel="stylesheet" href="../css/responsive.css?v=3">
</head>

<body data-page-id="settings" data-page-title="Portal Preferences & Settings">

  <div class="app-container">
    <aside class="sidebar" id="sidebarContainer"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbarContainer"></header>

      <main class="page-content">
        <div class="card" style="max-width:650px;">
          <h3
            style="font-size:16px; font-weight:700; margin-bottom:20px; border-bottom:1px solid var(--border-color); padding-bottom:12px; color:var(--text-primary);">
            <i class="fas fa-sliders-h" style="color:var(--primary-color); margin-right:8px;"></i> Application
            Preferences
          </h3>

          <div class="form-group">
            <label class="form-label">Theme Mode Preference</label>
            <select class="form-control" id="settingsThemeSelect">
              <option value="light">Light Mode</option>
              <option value="dark">Dark Mode</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">System Language</label>
            <select class="form-control" id="settingsLangSelect">
              <option value="en">English (US)</option>
              <option value="hi">Hindi (हिन्दी)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Email Notifications</label>
            <label class="checkbox-group">
              <input type="checkbox" checked>
              <span>Receive alert notifications for exam results and attendance warnings</span>
            </label>
          </div>

          <div style="margin-top:24px; text-align:right;">
            <button class="btn btn-primary" id="saveSettingsBtn"><i class="fas fa-save"></i> Save Preferences</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="../js/api.js?v=5"></script>
  <script src="../js/auth.js?v=5"></script>
  <script src="../js/utils.js?v=5"></script>
  <script src="../js/validation.js"></script>
  <script src="../js/app.js?v=5"></script>
  <script src="../js/chatbot.js"></script>
  <script src="../js/settings.js"></script>
</body>

</html>
