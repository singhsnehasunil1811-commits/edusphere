<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSphere — Portal Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .login-box {
      width: 100%;
      max-width: 460px;
      padding: 40px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      border-radius: 16px;
      position: relative;
    }
    .demo-chip {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(71, 85, 105, 0.7);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-mono);
    }
    .demo-chip:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      transform: translateY(-1px);
    }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: color 0.2s ease;
    }
    .back-home:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="login-container">
    <div class="login-box glass">
      <a href="/index.html" class="back-home">← Back to Overview</a>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <span class="badge badge-info">AUTHENTICATION GATEWAY</span>
        <button id="theme-toggle-btn" class="btn btn-secondary btn-icon btn-sm" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
        <div style="width:42px; height:42px; border-radius:10px; background:linear-gradient(135deg, #0284c7, #4f46e5); display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:0 0 15px rgba(56, 189, 248, 0.35);">
          ⚡
        </div>
        <div>
          <h2 style="font-size:1.6rem; font-weight:800; line-height:1.2;">Sign In to Portal</h2>
          <span style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">EDUSPHERE ACADEMIC SYSTEM</span>
        </div>
      </div>

      <p style="font-size:0.86rem; color:var(--text-muted); margin-bottom:20px;">Access your institutional dashboard with your credentials</p>

      <div id="login-error-msg" style="color:var(--danger); font-size:0.85rem; margin-bottom:14px; display:none; padding:10px; border:1px solid rgba(239,68,68,0.3); border-radius:8px; background:rgba(239,68,68,0.1);"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" style="font-size:0.82rem; font-weight:600;">System Access Role *</label>
          <select id="login-role" class="form-select" required>
            <option value="ADMIN">Institutional Administrator</option>
            <option value="TEACHER">Faculty / Department Teacher</option>
            <option value="STUDENT">Enrolled Student</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label" style="font-size:0.82rem; font-weight:600;">Institutional Email *</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@student360.com" required value="admin@student360.com" style="font-family:var(--font-mono); font-size:0.88rem;">
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label class="form-label" style="font-size:0.82rem; font-weight:600;">Master Security Key / Password *</label>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="admin123" style="font-family:var(--font-mono); font-size:0.88rem;">
            <button type="button" onclick="togglePasswordVisibility()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer;">👁</button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%; padding:12px; font-size:0.95rem;">
          Authenticate & Launch Dashboard ➔
        </button>
      </form>

      <div style="margin-top:24px; padding-top:18px; border-top:1px solid rgba(51, 65, 85, 0.5);">
        <div style="font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); font-weight:700; font-family:var(--font-mono); margin-bottom:10px;">One-Click Demo Credentials:</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="demo-chip" onclick="fillDemo('admin@student360.com','admin123','ADMIN')">⚡ Admin</button>
          <button type="button" class="demo-chip" onclick="fillDemo('teacher@student360.com','teacher123','TEACHER')">👩‍🏫 Faculty</button>
          <button type="button" class="demo-chip" onclick="fillDemo('student@student360.com','student123','STUDENT')">🎓 Student</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('student360_theme', next);
    }
    const savedTheme = localStorage.getItem('student360_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    Dashboard.initParticles();

    Auth.checkSession().then(user => {
      if (user) {
        window.location.href = '/app.html';
      }
    });

    function fillDemo(email, pass, role) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      document.getElementById('login-role').value = role;
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('login-password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('login-error-msg');
      const btn = document.getElementById('login-btn');
      errEl.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const role = document.getElementById('login-role').value;

      btn.disabled = true;
      btn.textContent = 'Verifying credentials with EduSphere...';

      try {
        await Auth.login(email, password, role);
        API.toast('Welcome back! Launching dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/app.html';
        }, 500);
      } catch (err) {
        errEl.textContent = err.message || 'Authentication failed. Please check your credentials.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Authenticate & Launch Dashboard ➔';
      }
    }
  </script>
</body>
</html>
